<link rel="stylesheet" href="/static/css/navbar.css">
<nav class="navbar {% if navbar_theme == 'light' %}light-nav{% endif %}">
  <div class="nav-container">
    <div class="logo"><a href="/dashboard{% if selected_region %}?region={{ selected_region }}{% endif %}"><img src="/static/images/logo.png" alt="Vayu" class="logo-home"></a></div>
    <div class="nav-links">
      <a href="/aqi{% if selected_region %}?region={{ selected_region }}{% endif %}" class="nav-btn">AQI</a>

      <a href="/about{% if selected_region %}?region={{ selected_region }}{% endif %}" class="nav-btn">About Us</a>
      <a href="/pay{% if selected_region %}?region={{ selected_region }}{% endif %}" class="nav-btn">Pay</a>

    </div>
  </div>
</nav>

<script>
document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.nav-btn').forEach(link => {
        if (link.getAttribute('href') === window.location.pathname) {
            link.classList.add('active');
        }
    });
});
</script>
